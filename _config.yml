# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: swfk 的安全笔记
subtitle: 'AI 安全 / 网络安全 / 工程实践'
description: '记录 AI 安全、网络安全、工具实践与技术复盘。'
keywords: AI安全, 网络安全, 大模型安全, LLM安全, 渗透测试, 安全运营
author: swfk2154
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blogbu2154.site
root: /
permalink: :title/
permalink_defaults:
pretty_urls:  
trailing_index: false # Set to false to remove trailing 'index.html' from permalinks  
trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - googlef6796c5297da4129.html
  - BingSiteAuth.xml

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: true
  theme: github-dark
prismjs:
  preprocess: true
  line_number: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
# 用 date：避免每次重新生成把所有文章的「更新于」刷成当天；需要标注更新时在 front-matter 里显式写 updated
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 12
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: clay

# Sitemap
sitemap:
  path: sitemap.xml
  rel: false
baidusitemap:
  path: baidusitemap.xml

# 站内搜索索引（供主题搜索框使用）
search:
  path: search.json
  field: post
  content: true
  format: striptags

# Feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:swfk2154/swfk2154.github.io.git
  branch: main
  # 如果想绑定自定义域名，部署时会在 CNAME 文件中体现
