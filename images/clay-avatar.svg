  <g class="eye">
    <path d="M48 38v16" stroke="rgba(255,255,255,0.92)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="48" cy="47" r="2" fill="rgba(255,255,255,0.92)"/>
  </g>
</svg>
