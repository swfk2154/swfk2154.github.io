<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="avatar">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e69463"/>
      <stop offset="1" stop-color="#a94c27"/>
    </linearGradient>
    <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0d9cb"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="30" fill="url(#cg)"/>
  <rect x="4" y="4" width="88" height="88" rx="30" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  <ellipse cx="34" cy="22" rx="14" ry="8" fill="rgba(255,255,255,0.28)"/>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .eye {
        animation: clay-blink 3.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes clay-blink {
        /* 每个 3.6s 周期眨两次：约 1.0s 与 2.9s 处，加载后很快能看到 */
        0%, 26%, 32%, 78%, 84%, 100% { transform: scaleY(1); }
        29% { transform: scaleY(0.06); }
        81% { transform: scaleY(0.06); }
      }
    }
  </style>
  <path d="M48 20c7.2 5.4 14.6 8.2 23 9.3v16.6c0 12.6-8.4 22-23 28.4C33.4 68 25 58.5 25 45.9V29.3C33.4 28.2 40.8 25.4 48 20z" fill="url(#cs)"/>
